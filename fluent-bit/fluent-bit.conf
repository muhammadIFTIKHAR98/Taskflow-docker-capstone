[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    Tag               docker.*
    Refresh_Interval  5

[OUTPUT]
    Name           opensearch
    Match          *
    Host           opensearch-test
    Port           9200
    Index          taskflow-logs
    HTTP_User      admin
    HTTP_Passwd    TaskFlow@2026
    tls            On
    tls.verify     Off
    Suppress_Type_Name On
